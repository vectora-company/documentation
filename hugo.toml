baseURL = 'https://docs.vectora.company/'
title = 'Vectora Docs'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
enableEmoji = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']
cleanDestinationDir = true

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    weight = 1
    title = 'Vectora Docs'
    [languages.en.params]
      description = 'Official documentation for Vectora Ltda. open-source projects.'
    [[languages.en.menu.main]]
      identifier = 'organization'
      name = 'GitHub organization'
      url = 'https://github.com/vectora-company'
      weight = 1
    [[languages.en.menu.main]]
      identifier = 'language-switch'
      weight = 2
      [languages.en.menu.main.params]
        type = 'language-switch'
    [[languages.en.menu.main]]
      identifier = 'search'
      weight = 3
      [languages.en.menu.main.params]
        type = 'search'
    [[languages.en.menu.main]]
      identifier = 'theme-toggle'
      weight = 4
      [languages.en.menu.main.params]
        type = 'theme-toggle'

  [languages.pt]
    label = 'Português'
    locale = 'pt-BR'
    weight = 2
    title = 'Vectora Docs'
    [languages.pt.params]
      description = 'Documentação oficial dos projetos open source da Vectora Ltda.'
    [[languages.pt.menu.main]]
      identifier = 'organization'
      name = 'Organização no GitHub'
      url = 'https://github.com/vectora-company'
      weight = 1
    [[languages.pt.menu.main]]
      identifier = 'language-switch'
      weight = 2
      [languages.pt.menu.main.params]
        type = 'language-switch'
    [[languages.pt.menu.main]]
      identifier = 'search'
      weight = 3
      [languages.pt.menu.main.params]
        type = 'search'
    [[languages.pt.menu.main]]
      identifier = 'theme-toggle'
      weight = 4
      [languages.pt.menu.main.params]
        type = 'theme-toggle'

[params.navbar]
  displayTitle = true
  displayLogo = true
  [params.navbar.logo]
    path = 'favicon.svg'
    link = '/'

[params.page]
  width = 'normal'

[params.toc]
  displayToc = true

[params.footer]
  displayCopyright = true
  displayPoweredBy = false

[params.theme]
  default = 'system'
  displayToggle = true

[params]
  title = 'Vectora Docs'
  description = 'Official documentation for Vectora Ltda. open-source projects.'
  images = ['https://docs.vectora.company/favicon.png']

[params.author]
  name = 'Vectora Ltda.'
